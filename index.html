<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1119" />
    <script>
      // Apply only a validated appearance preference before the first paint.
      (() => {
        let saved;
        try { saved = localStorage.getItem('campus-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved :
          window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d1119' : '#f4f6f9';
      })();
    </script>
    <meta
      name="description"
      content="Кампус — конкурсный концепт личного кабинета студента. Только вымышленные данные."
    />
    <title>Кампус — личный кабинет студента</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
